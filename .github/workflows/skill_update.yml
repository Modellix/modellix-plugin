name: Skill Update

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Run repository tests
        run: npm test

      - name: Compile Python helpers
        run: python3 -m py_compile scripts/*.py skills/modellix-design/scripts/*.py skills/modellix-ffmpeg/scripts/*.py

      - name: Clean Python build artifacts
        run: python3 skills/modellix-design/scripts/clean_build_artifacts.py

      - name: Check package contents
        run: npm pack --dry-run

  # skills.sh records a skill when the skills CLI installs it. Install only
  # modellix-design; the other skills stay inside the plugin package.
  sync-skills:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install modellix-design
        run: npx --yes skills add https://github.com/Modellix/modellix-plugin --skill modellix-design -g --agent codex -y
