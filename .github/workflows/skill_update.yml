name: Skill Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    secrets:
      SMITHERY_TOKEN:
        required: false
      CLAWHUB_TOKEN:
        required: false

jobs:
  sync-smithery:
    runs-on: ubuntu-latest
    steps:
      # Sync action 1/2: update Smithery registry via API.
      - name: Update Smithery skill
        env:
          SMITHERY_TOKEN: ${{ secrets[format('{0}', 'SMITHERY_TOKEN')] || '' }}
          SKILL_GIT_URL: https://github.com/Modellix/modellix-plugin/tree/main/skills/modellix
        run: |
          if [ -z "$SMITHERY_TOKEN" ]; then
            echo "SMITHERY_TOKEN is not set. Please configure it in repository secrets."
            exit 1
          fi

          # The Smithery registry slug stays modellix/modellix-skill to preserve
          # existing installs; only the gitUrl moves to the plugin layout.
          curl --fail-with-body --request PUT \
            --url "https://api.smithery.ai/skills/modellix/modellix-skill" \
            --header "Authorization: Bearer ${SMITHERY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"gitUrl\":\"${SKILL_GIT_URL}\"}"

      # Sync action 2/2: wait then run npx skills add.
      - name: Wait 60 seconds before adding skill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 60

      - name: Add skill via npx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx skills add https://github.com/Modellix/modellix-plugin --skill modellix

  # ClawHub rejects republishing an existing package version, and every skill
  # publish burns a new version number, so only publish what actually changed.
  # Manual dispatches always publish.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.check.outputs.package }}
      skill: ${{ steps.check.outputs.skill }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKILL_PATH: skills/modellix
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def version(blob):
              return json.loads(blob)["version"]

          is_push = os.environ["EVENT_NAME"] == "push"

          current = version(Path("package.json").read_text(encoding="utf-8"))
          previous = None
          if is_push:
              result = subprocess.run(
                  ["git", "show", "HEAD~1:package.json"], capture_output=True, text=True
              )
              if result.returncode == 0:
                  previous = version(result.stdout)
          package_changed = previous is None or previous != current
          print(f"Package version: {previous} -> {current} (publish: {package_changed})")

          skill_path = os.environ["SKILL_PATH"]
          skill_changed = True
          if is_push:
              result = subprocess.run(
                  ["git", "diff", "--name-only", "HEAD~1", "HEAD", "--", skill_path],
                  capture_output=True,
                  text=True,
              )
              if result.returncode == 0:
                  skill_changed = bool(result.stdout.strip())
          print(f"Skill files changed: {skill_changed}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"package={str(package_changed).lower()}\n")
              fh.write(f"skill={str(skill_changed).lower()}\n")
          PY

  # Publish skills/modellix to ClawHub (owner modellix, slug modellix).
  # Requires repository secret CLAWHUB_TOKEN. Unchanged content is skipped.
  #
  # This runs the ClawHub CLI directly instead of openclaw/clawhub's reusable
  # skill-publish.yml: that workflow only maps would-publish/published/unchanged,
  # so a successful submit that returns "pending-publication" (queued for security
  # scans) is reported as a failed publish.
  sync-clawhub-skill:
    needs: detect-changes
    if: needs.detect-changes.outputs.skill == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLAWHUB_CLI_VERSION: 0.23.1
      CLAWHUB_REGISTRY: https://clawhub.ai
      SKILL_PATH: skills/modellix
      SKILL_OWNER: modellix
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Write ClawHub config
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "${CLAWHUB_TOKEN:-}" ]; then
            echo "::error::CLAWHUB_TOKEN is not set. Please configure it in repository secrets."
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "clawhub-config.json"
          path.write_text(
              json.dumps({"registry": os.environ["CLAWHUB_REGISTRY"], "token": os.environ["CLAWHUB_TOKEN"]}) + "\n",
              encoding="utf-8",
          )
          path.chmod(0o600)
          PY
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"

      - name: Publish skill to ClawHub
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          MAX_ATTEMPTS = 5
          TAKEN_VERSION = re.compile(r"[Vv]ersion (\d+)\.(\d+)\.(\d+) already exists")

          skill_path = os.environ["SKILL_PATH"]
          base = [
              "npx", "--yes", f"clawhub@{os.environ['CLAWHUB_CLI_VERSION']}",
              "--registry", os.environ["CLAWHUB_REGISTRY"],
              "skill", "publish", skill_path,
              "--json",
              "--owner", os.environ["SKILL_OWNER"],
              "--source-repo", os.environ["GITHUB_REPOSITORY"],
              "--source-commit", os.environ["GITHUB_SHA"],
              "--source-ref", os.environ["GITHUB_REF"],
              "--source-path", skill_path,
          ]

          # The CLI defaults to "next patch after the latest published version",
          # which collides when the previous submission is still queued for
          # security scans (pending-publication is not counted as published).
          version = None
          for attempt in range(1, MAX_ATTEMPTS + 1):
              command = base + (["--version", version] if version else [])
              completed = subprocess.run(command, capture_output=True, text=True)
              sys.stderr.write(completed.stderr)
              print(completed.stdout)
              if completed.returncode == 0:
                  break

              taken = TAKEN_VERSION.search(completed.stderr + completed.stdout)
              if not taken or attempt == MAX_ATTEMPTS:
                  raise SystemExit(f"clawhub skill publish exited with {completed.returncode}")
              major, minor, patch = (int(part) for part in taken.groups())
              version = f"{major}.{minor}.{patch + 1}"
              print(f"{taken.group(0)}; retrying as {version}")

          status = json.loads(completed.stdout).get("status")
          # "pending-publication" and "submitted" mean the upload landed and is
          # waiting on ClawHub security scans, so both are successful outcomes.
          if status not in {"published", "pending-publication", "submitted", "unchanged"}:
              raise SystemExit(f"Unexpected publish status: {status!r}")
          print(f"ClawHub skill publish status: {status}")
          PY

  # Publish this Open Plugins repo as an OpenClaw bundle-plugin package
  # (@modellix/modellix-plugin). Skill-only content; no native runtime entrypoint.
  sync-clawhub-package:
    needs: detect-changes
    if: needs.detect-changes.outputs.package == 'true'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      owner: modellix
      family: bundle-plugin
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
