name: Skill Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    secrets:
      SMITHERY_TOKEN:
        required: false
      CLAWHUB_TOKEN:
        required: false

jobs:
  sync-smithery:
    runs-on: ubuntu-latest
    steps:
      # Sync action 1/2: update Smithery registry via API.
      - name: Update Smithery skill
        env:
          SMITHERY_TOKEN: ${{ secrets[format('{0}', 'SMITHERY_TOKEN')] || '' }}
          SKILL_GIT_URL: https://github.com/Modellix/modellix-plugin/tree/main/skills/modellix
        run: |
          if [ -z "$SMITHERY_TOKEN" ]; then
            echo "SMITHERY_TOKEN is not set. Please configure it in repository secrets."
            exit 1
          fi

          # The Smithery registry slug stays modellix/modellix-skill to preserve
          # existing installs; only the gitUrl moves to the plugin layout.
          curl --fail-with-body --request PUT \
            --url "https://api.smithery.ai/skills/modellix/modellix-skill" \
            --header "Authorization: Bearer ${SMITHERY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"gitUrl\":\"${SKILL_GIT_URL}\"}"

      # Sync action 2/2: wait then run npx skills add.
      - name: Wait 60 seconds before adding skill
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: sleep 60

      - name: Add skill via npx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx skills add https://github.com/Modellix/modellix-plugin --skill modellix

  # Publish skills/modellix to ClawHub (owner modellix, slug modellix).
  # Requires repository secret CLAWHUB_TOKEN. Unchanged content is skipped.
  sync-clawhub-skill:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      owner: modellix
      skill_path: skills/modellix
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  # Publish this Open Plugins repo as an OpenClaw bundle-plugin package
  # (@modellix/modellix-plugin). Skill-only content; no native runtime entrypoint.
  sync-clawhub-package:
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@main
    with:
      owner: modellix
      family: bundle-plugin
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
